<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="skip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e08a2b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">DualHeadUNet — ResNet18 backbone (input 512×512)</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#777">Shared encoder · two U-Net decoders · skip connections (orange) reused by both heads</text>

  <!-- ============ INPUT ============ -->
  <rect x="40" y="350" width="120" height="60" rx="6" fill="#eef2f7" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="100" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#234">Input</text>
  <text x="100" y="395" text-anchor="middle" font-size="11" fill="#567">[B, 3, 512, 512]</text>

  <!-- ============ ENCODER COLUMN ============ -->
  <rect x="210" y="120" width="170" height="520" rx="10" fill="#f3f7fb" stroke="#5b7fa6" stroke-width="1.5"/>
  <text x="295" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#234">ENCODER</text>
  <text x="295" y="162" text-anchor="middle" font-size="11" fill="#789">ResNet18 · ImageNet · 11.2M</text>

  <!-- encoder feature levels (top=fine, bottom=bottleneck) -->
  <!-- f1 -->
  <rect x="230" y="178" width="130" height="48" rx="5" fill="#dce9f5" stroke="#5b7fa6"/>
  <text x="295" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#234">stem  f1</text>
  <text x="295" y="214" text-anchor="middle" font-size="10" fill="#567">[64, 256, 256]</text>
  <!-- f2 -->
  <rect x="230" y="234" width="130" height="48" rx="5" fill="#cfe1f1" stroke="#5b7fa6"/>
  <text x="295" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#234">layer1  f2</text>
  <text x="295" y="270" text-anchor="middle" font-size="10" fill="#567">[64, 128, 128]</text>
  <!-- f3 -->
  <rect x="230" y="290" width="130" height="48" rx="5" fill="#c2d9ed" stroke="#5b7fa6"/>
  <text x="295" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#234">layer2  f3</text>
  <text x="295" y="326" text-anchor="middle" font-size="10" fill="#567">[128, 64, 64]</text>
  <!-- f4 -->
  <rect x="230" y="346" width="130" height="48" rx="5" fill="#b5d1e9" stroke="#5b7fa6"/>
  <text x="295" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#234">layer3  f4</text>
  <text x="295" y="382" text-anchor="middle" font-size="10" fill="#567">[256, 32, 32]</text>
  <!-- f5 bottleneck -->
  <rect x="230" y="402" width="130" height="52" rx="5" fill="#8fb8db" stroke="#39608a" stroke-width="1.5"/>
  <text x="295" y="422" text-anchor="middle" font-size="11" font-weight="700" fill="#16324d">layer4  f5</text>
  <text x="295" y="438" text-anchor="middle" font-size="10" fill="#16324d">[512, 16, 16]</text>
  <text x="295" y="450" text-anchor="middle" font-size="9" fill="#16324d" font-style="italic">bottleneck</text>

  <text x="295" y="478" text-anchor="middle" font-size="10" fill="#789">↓ resolution halves each stage ↓</text>

  <!-- input -> encoder -->
  <line x1="160" y1="380" x2="226" y2="420" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ WALL DECODER (top) ============ -->
  <rect x="470" y="90" width="430" height="230" rx="10" fill="#f1f8f2" stroke="#4a9a5e" stroke-width="1.5"/>
  <text x="685" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5a2e">WALL DECODER  (U-Net · 3.15M)</text>

  <!-- wall decoder blocks -->
  <g font-size="9.5">
    <rect x="486" y="128" width="74" height="64" rx="5" fill="#d8eede" stroke="#4a9a5e"/>
    <text x="523" y="146" text-anchor="middle" font-weight="600" fill="#1f5a2e">blk0</text>
    <text x="523" y="160" text-anchor="middle" fill="#3a7048">768→256</text>
    <text x="523" y="174" text-anchor="middle" fill="#567">32×32</text>

    <rect x="568" y="128" width="74" height="64" rx="5" fill="#d8eede" stroke="#4a9a5e"/>
    <text x="605" y="146" text-anchor="middle" font-weight="600" fill="#1f5a2e">blk1</text>
    <text x="605" y="160" text-anchor="middle" fill="#3a7048">384→128</text>
    <text x="605" y="174" text-anchor="middle" fill="#567">64×64</text>

    <rect x="650" y="128" width="74" height="64" rx="5" fill="#d8eede" stroke="#4a9a5e"/>
    <text x="687" y="146" text-anchor="middle" font-weight="600" fill="#1f5a2e">blk2</text>
    <text x="687" y="160" text-anchor="middle" fill="#3a7048">192→64</text>
    <text x="687" y="174" text-anchor="middle" fill="#567">128×128</text>

    <rect x="732" y="128" width="74" height="64" rx="5" fill="#d8eede" stroke="#4a9a5e"/>
    <text x="769" y="146" text-anchor="middle" font-weight="600" fill="#1f5a2e">blk3</text>
    <text x="769" y="160" text-anchor="middle" fill="#3a7048">128→32</text>
    <text x="769" y="174" text-anchor="middle" fill="#567">256×256</text>

    <rect x="814" y="128" width="74" height="64" rx="5" fill="#d8eede" stroke="#4a9a5e"/>
    <text x="851" y="146" text-anchor="middle" font-weight="600" fill="#1f5a2e">blk4</text>
    <text x="851" y="160" text-anchor="middle" fill="#3a7048">32→16</text>
    <text x="851" y="174" text-anchor="middle" fill="#567">512×512</text>
  </g>
  <!-- internal arrows wall -->
  <line x1="560" y1="160" x2="566" y2="160" stroke="#4a9a5e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="642" y1="160" x2="648" y2="160" stroke="#4a9a5e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="724" y1="160" x2="730" y2="160" stroke="#4a9a5e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="806" y1="160" x2="812" y2="160" stroke="#4a9a5e" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="685" y="232" text-anchor="middle" font-size="10" fill="#789">each block: upsample ×2  →  concat skip  →  conv·bn·relu ×2</text>
  <!-- seg head wall -->
  <rect x="486" y="252" width="180" height="48" rx="5" fill="#bfe3c8" stroke="#2f7a44"/>
  <text x="576" y="271" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5a2e">SegHead  Conv 16→1</text>
  <text x="576" y="287" text-anchor="middle" font-size="10" fill="#567">145 params · no activation</text>
  <line x1="851" y1="192" x2="640" y2="250" stroke="#4a9a5e" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============ ROOM DECODER (bottom) ============ -->
  <rect x="470" y="440" width="430" height="230" rx="10" fill="#fbf3f6" stroke="#b5557f" stroke-width="1.5"/>
  <text x="685" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3260">ROOM DECODER  (U-Net · 3.15M)</text>

  <g font-size="9.5">
    <rect x="486" y="478" width="74" height="64" rx="5" fill="#f2dbe5" stroke="#b5557f"/>
    <text x="523" y="496" text-anchor="middle" font-weight="600" fill="#8a3260">blk0</text>
    <text x="523" y="510" text-anchor="middle" fill="#9c476e">768→256</text>
    <text x="523" y="524" text-anchor="middle" fill="#567">32×32</text>

    <rect x="568" y="478" width="74" height="64" rx="5" fill="#f2dbe5" stroke="#b5557f"/>
    <text x="605" y="496" text-anchor="middle" font-weight="600" fill="#8a3260">blk1</text>
    <text x="605" y="510" text-anchor="middle" fill="#9c476e">384→128</text>
    <text x="605" y="524" text-anchor="middle" fill="#567">64×64</text>

    <rect x="650" y="478" width="74" height="64" rx="5" fill="#f2dbe5" stroke="#b5557f"/>
    <text x="687" y="496" text-anchor="middle" font-weight="600" fill="#8a3260">blk2</text>
    <text x="687" y="510" text-anchor="middle" fill="#9c476e">192→64</text>
    <text x="687" y="524" text-anchor="middle" fill="#567">128×128</text>

    <rect x="732" y="478" width="74" height="64" rx="5" fill="#f2dbe5" stroke="#b5557f"/>
    <text x="769" y="496" text-anchor="middle" font-weight="600" fill="#8a3260">blk3</text>
    <text x="769" y="510" text-anchor="middle" fill="#9c476e">128→32</text>
    <text x="769" y="524" text-anchor="middle" fill="#567">256×256</text>

    <rect x="814" y="478" width="74" height="64" rx="5" fill="#f2dbe5" stroke="#b5557f"/>
    <text x="851" y="496" text-anchor="middle" font-weight="600" fill="#8a3260">blk4</text>
    <text x="851" y="510" text-anchor="middle" fill="#9c476e">32→16</text>
    <text x="851" y="524" text-anchor="middle" fill="#567">512×512</text>
  </g>
  <line x1="560" y1="510" x2="566" y2="510" stroke="#b5557f" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="642" y1="510" x2="648" y2="510" stroke="#b5557f" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="724" y1="510" x2="730" y2="510" stroke="#b5557f" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="806" y1="510" x2="812" y2="510" stroke="#b5557f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="685" y="582" text-anchor="middle" font-size="10" fill="#789">same structure, independent weights</text>
  <rect x="486" y="602" width="180" height="48" rx="5" fill="#eccada" stroke="#8a3260"/>
  <text x="576" y="621" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a3260">SegHead  Conv 16→N</text>
  <text x="576" y="637" text-anchor="middle" font-size="10" fill="#567">N room classes</text>
  <line x1="851" y1="542" x2="640" y2="600" stroke="#b5557f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ============ bottleneck f5 -> both decoder blk0 ============ -->
  <line x1="360" y1="425" x2="484" y2="170" stroke="#39608a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="360" y1="430" x2="484" y2="520" stroke="#39608a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ============ SKIP CONNECTIONS (orange, dashed) ============ -->
  <!-- f4 -> wall blk0 + room blk0 -->
  <path d="M362,366 C420,366 430,160 484,160" fill="none" stroke="#e08a2b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <path d="M362,372 C420,372 430,510 484,510" fill="none" stroke="#e08a2b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <!-- f3 -> blk1 -->
  <path d="M362,312 C440,312 500,200 566,168" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <path d="M362,318 C440,318 500,470 566,518" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <!-- f2 -> blk2 -->
  <path d="M362,258 C470,258 580,210 648,168" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <path d="M362,264 C470,264 580,460 648,518" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <!-- f1 -> blk3 -->
  <path d="M362,202 C520,202 660,220 730,168" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <path d="M362,208 C520,208 660,450 730,518" fill="none" stroke="#e08a2b" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#skip)"/>

  <!-- ============ OUTPUTS ============ -->
  <rect x="960" y="252" width="170" height="60" rx="6" fill="#e3f3e7" stroke="#2f7a44" stroke-width="1.5"/>
  <text x="1045" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5a2e">Wall logits</text>
  <text x="1045" y="294" text-anchor="middle" font-size="11" fill="#567">[B, 1, 512, 512]</text>
  <line x1="666" y1="276" x2="956" y2="282" stroke="#2f7a44" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="960" y="602" width="170" height="60" rx="6" fill="#f7e3ec" stroke="#8a3260" stroke-width="1.5"/>
  <text x="1045" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#8a3260">Room logits</text>
  <text x="1045" y="644" text-anchor="middle" font-size="11" fill="#567">[B, N, 512, 512]</text>
  <line x1="666" y1="626" x2="956" y2="632" stroke="#8a3260" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="660" width="380" height="84" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="56" y="682" font-size="11" font-weight="700" fill="#444">Legend</text>
  <line x1="60" y1="700" x2="96" y2="700" stroke="#39608a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="104" y="704" font-size="10.5" fill="#555">main data flow (bottleneck → decoder)</text>
  <line x1="60" y1="722" x2="96" y2="722" stroke="#e08a2b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#skip)"/>
  <text x="104" y="726" font-size="10.5" fill="#555">skip connection (encoder feature reused by both heads)</text>

  <text x="900" y="710" font-size="10.5" fill="#888">Encoder runs ONCE; features shared by both decoders.</text>
  <text x="900" y="726" font-size="10.5" fill="#888">WallOnlyUNet (v2) = encoder + wall decoder only.</text>
</svg>
